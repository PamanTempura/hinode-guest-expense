<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17334e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./static/manifest.json"><link rel="apple-touch-icon" href="./static/icon-192.png"><link rel="stylesheet" href="./static/style.css"><title>HINODE Guest Expense</title></head><body><main><header><b>HINODE</b><small>Guest Expense</small><p id="offline">Menyiapkan mode offline…</p></header><section><label>Kunjungan tamu</label><select id="guest"></select><form id="newGuest"><input id="guestName" placeholder="Nama tamu / perusahaan" required maxlength="150"><button>Tambah kunjungan</button></form></section><section class="total"><small>Total pengeluaran</small><h1 id="total">Rp0</h1><span id="count"></span></section><section><h2>Catat pengeluaran</h2><form id="entry"><label class="capture">📷 Foto kwitansi<input id="camera" type="file" accept="image/*" capture="environment"></label><label>Atau pilih dari galeri<input id="gallery" type="file" accept="image/*" multiple></label><div id="photos"></div><button type="button" id="scan">Baca tanggal & nominal (OCR)</button><p id="scanStatus" role="status"></p><details><summary>Teks hasil OCR</summary><pre id="raw"></pre></details><label>Tanggal pembelian<input id="date" type="date" required></label><label>Jumlah pengeluaran (Rp)<input id="amount" type="number" min="1" max="1000000000000" step="1" inputmode="numeric" required></label><label>Keterangan pembelian (wajib)<input id="description" type="text" required maxlength="200" placeholder="Contoh: Makan siang tamu, BBM, parkir"></label><p id="saveHint" role="status">Lengkapi semua data untuk menyimpan.</p><button id="save" disabled>Simpan transaksi</button><button type="button" id="cancel" hidden>Batal edit</button></form></section><section><h2>Riwayat pengeluaran</h2><div id="history"></div></section><section><h2>Laporan & backup</h2><button id="excel">Export Excel + foto</button><button id="pdf">Export PDF + foto</button><button id="backup">Backup ZIP semua kunjungan</button><label>Pulihkan backup ZIP<input id="restore" type="file" accept=".zip"></label><p>Backup rutin diperlukan. Data tersimpan pada perangkat ini, tidak otomatis sinkron.</p></section></main><script src="./static/vendor/tesseract.js"></script><script src="./static/vendor/exceljs.js"></script><script src="./static/vendor/jspdf.js"></script><script src="./static/vendor/jszip.js"></script><script src="./static/app.js"></script></body></html>
